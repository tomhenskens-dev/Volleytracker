name: discover
on:
  push:
    paths: ['.github/workflows/discover.yml', 'scripts/discover.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/discover.mjs
      - run: |
          git config user.name "volleytracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add discovery && git commit -m "discovery output [skip ci]" && git push
